name: profile

# Cards and the snake are pushed to the orphan `output` branch, which README.md reads from raw.githubusercontent.com.
# The only commits to main come from `sync`, when a featured repo was deleted or made private, or a new public
# non-fork repo appeared. Its pushes don't trigger workflows, so `cards` runs right after it changes anything.
on:
  schedule:
    - cron: "17 6 * * *" # cards
    - cron: "47 * * * *" # sync only
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A deleted repo has no card, so its entry would leave a broken image on the README: drop it and re-render.
  # New public non-fork repos are appended as featured.
  sync:
    name: sync featured repos
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/generate.py --sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: commit if anything changed
        id: commit
        run: |
          git diff --quiet -- profile.toml README.md && exit 0
          git add profile.toml README.md
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -q -m "sync: update featured repos"
          git push -q origin HEAD:main
          echo changed=true >> "$GITHUB_OUTPUT"

  readme:
    name: readme is in sync with profile.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/generate.py --check

  cards:
    name: draw cards
    # sync is skipped on pull requests and may fail; neither should stop the daily cards
    if: >-
      !cancelled() && needs.readme.result == 'success' && github.event_name != 'pull_request'
      && (github.event.schedule != '47 * * * *' || needs.sync.outputs.changed == 'true')
    needs: [readme, sync]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # the branch head, not the triggering commit, so a profile.toml that sync just pushed gets its cards
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # PROFILE_TOKEN (a PAT with read:user) is optional; it lets private contributions count toward the totals.
      - name: generate cards
        run: python scripts/generate.py --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}

      - name: generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#ff3068&color_dots=#21262d,#3b1450,#5c1f80,#8b21b5,#ff3068&color_background=transparent
            dist/snake-light.svg?color_snake=#8b21b5&color_dots=#ebedf0,#e3c4ef,#c58ae0,#8b21b5,#ff3068&color_background=transparent

      - name: push to output branch
        working-directory: dist
        run: |
          rm -f data.json preview.html
          git init -q -b output
          git add .
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -q -m "refresh profile cards"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output
